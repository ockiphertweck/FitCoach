services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: fitcoach
      POSTGRES_USER: fitcoach
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    # Published on localhost only, so `pnpm dev` / `db:migrate` on the host can reach it
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitcoach"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      # Inside the compose network the database host is `postgres`, not localhost
      DATABASE_URL: postgresql://fitcoach:${DB_PASSWORD}@postgres:5432/fitcoach
    ports:
      - "3000:3000"

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    restart: unless-stopped
    env_file: .env
    ports:
      - "3001:3000"

volumes:
  postgres_data:
